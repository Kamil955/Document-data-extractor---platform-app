[project]
name = "contract-extractor-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.54.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "psycopg[binary]>=3.3.8",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "azure-storage-blob>=12.31.1",
    "aiohttp>=3.14.5",
    "python-multipart>=0.0.33",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.uv]
# This is an application, not a library: no need to build or install it as a package.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import sorting, UP: modern syntax,
# B: likely bugs, ASYNC: blocking calls inside async code.
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# The app is not installed as a package, so put backend/ on the import path.
pythonpath = ["."]
markers = ["integration: needs a running Postgres (see DATABASE_URL)"]
