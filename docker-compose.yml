services:
  postgres:
    # Postgres with the pgvector extension preinstalled (needed for RAG in stage 1).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-contract}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contract}
      POSTGRES_DB: ${POSTGRES_DB:-contract}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-contract} -d ${POSTGRES_DB:-contract}"]
      interval: 5s
      timeout: 5s
      retries: 10

  floci-az:
    # Local Azure emulator. We only use Blob Storage, so the Docker socket mount
    # (needed for Azure Functions) is deliberately left out.
    image: floci/floci-az:latest
    ports:
      - "4577:4577"
    environment:
      # hybrid = in-memory speed with periodic flushing to /app/data, so uploaded files
      # survive restarts just like the database rows that point to them.
      FLOCI_AZ_STORAGE_MODE: hybrid
    volumes:
      - floci-data:/app/data

  backend:
    build: ./backend
    environment:
      # Inside the compose network the hosts are the service names, not localhost.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-contract}:${POSTGRES_PASSWORD:-contract}@postgres:5432/${POSTGRES_DB:-contract}
      # floci-az does not validate credentials; the key only has to be valid base64.
      AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=bG9jYWwtZGV2LWtleQ==;BlobEndpoint=http://floci-az:4577/devstoreaccount1;"
    depends_on:
      postgres:
        condition: service_healthy
      # "started" is enough: the app retries the storage connection at startup.
      floci-az:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      # Bind-mount the source so --reload picks up edits without rebuilding the image.
      - ./backend:/app
    # Dev only: apply migrations on startup, then run the server with auto-reload.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    # Background ingestion: parses documents, chunks them and calls Ollama for embeddings.
    # network_mode: host lets it reach Ollama on the host's localhost:11434 without exposing
    # Ollama (which has no authentication) to the whole LAN. The price: no service-name DNS,
    # so Postgres and floci-az are addressed through their published host ports.
    build: ./backend
    network_mode: host
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-contract}:${POSTGRES_PASSWORD:-contract}@localhost:5432/${POSTGRES_DB:-contract}
      AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=bG9jYWwtZGV2LWtleQ==;BlobEndpoint=http://localhost:4577/devstoreaccount1;"
      OLLAMA_BASE_URL: http://localhost:11434
    depends_on:
      postgres:
        condition: service_healthy
      floci-az:
        condition: service_started
      # The backend applies migrations on startup; wait so the tables exist.
      backend:
        condition: service_started
    volumes:
      - ./backend:/app
    command: python -m app.ingestion.worker

volumes:
  pgdata:
  floci-data:
